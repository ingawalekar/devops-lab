apiVersion: apps/v1
kind: Deployment

metadata:
  name: configmap-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: configmap-demo

  template:
    metadata:
      labels:
        app: configmap-demo

    spec:
      containers:
      - name: nginx

        image: nginx

        env:
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: web-config
              key: APP_NAME

        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: web-config
              key: ENVIRONMENT

        - name: VERSION
          valueFrom:
            configMapKeyRef:
              name: web-config
              key: VERSION

        command:
        - /bin/sh
        - -c

        args:
        - |
          echo "<html><body><h1>$APP_NAME</h1><h2>Environment: $ENVIRONMENT</h2><h2>Version: $VERSION</h2></body></html>" > /usr/share/nginx/html/index.html
          nginx -g 'daemon off;'

        ports:
        - containerPort: 80
