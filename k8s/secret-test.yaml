apiVersion: v1
kind: Pod

metadata:
  name: secret-test

spec:
  containers:
  - name: secret-test

    image: busybox

    command:
    - sleep
    - "3600"

    env:
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: DB_USER

    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: app-secret
          key: DB_PASSWORD
