apiVersion: v1
kind: Pod

metadata:
  name: config-test

spec:
  containers:
  - name: config-test
    image: busybox

    command:
    - sleep
    - "3600"

    env:
    - name: APP_NAME
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: APP_NAME

    - name: ENVIRONMENT
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: ENVIRONMENT

    - name: VERSION
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: VERSION
