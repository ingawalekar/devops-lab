apiVersion: v1
kind: Pod

metadata:
  name: pv-test

spec:
  containers:
  - name: busybox

    image: busybox

    command:
      - sleep
      - "3600"

    volumeMounts:
    - mountPath: /ganesh-data
      name: storage

  volumes:
  - name: storage
    persistentVolumeClaim:
      claimName: ganesh-pvc
